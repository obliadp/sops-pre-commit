---
# This should PASS - SecretManagerSecretVersion with spec.secretData.valueFrom (reference)
apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
kind: SecretManagerSecretVersion
metadata:
  name: my-secret-version
  namespace: my-namespace
spec:
  parent:
    name: my-secret
  secretData:
    valueFrom:
      secretKeyRef:
        name: existing-secret
        key: api-key
# valueFrom is a reference to another secret, not the actual value, so it doesn't need encryption